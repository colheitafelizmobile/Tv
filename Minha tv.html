<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha Biblioteca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07070b;
    --bg2: #0f0f16;
    --surface: rgba(255,255,255,.035);
    --surface-h: rgba(255,255,255,.07);
    --line: rgba(255,255,255,.07);
    --line-strong: rgba(255,255,255,.14);
    --text: #f4f4f8;
    --muted: #8d91a2;
    --dim: #5a5e70;
    --gold: #f2b544;
    --coral: #ff6b4a;
    --grad: linear-gradient(135deg, #f2b544 0%, #ff6b4a 100%);
    --shadow: 0 20px 50px rgba(0,0,0,.55);
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: "Outfit", "Segoe UI", system-ui, sans-serif; color: var(--text);
    background:
      radial-gradient(1200px 700px at 85% -10%, rgba(255,107,74,.10), transparent 60%),
      radial-gradient(900px 600px at -10% 10%, rgba(242,181,68,.07), transparent 60%),
      var(--bg);
    overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  button, input, select { font-family: inherit; color: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #20212c; border-radius: 10px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  .app { display: grid; grid-template-columns: 264px 1fr; height: 100vh; }

  /* ================= Sidebar ================= */
  aside {
    position: relative; padding: 28px 18px 22px; display: flex; flex-direction: column; gap: 26px; overflow-y: auto;
    background: linear-gradient(180deg, #11111a 0%, #08080d 100%); border-right: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 13px; padding: 0 8px; }
  .logo {
    width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--grad);
    box-shadow: 0 10px 30px rgba(255,107,74,.3); color: #15100a; font-size: 18px;
  }
  .brand h1 { margin: 0; font-family: "Fraunces", Georgia, serif; font-style: italic; font-weight: 500; font-size: 22px; letter-spacing: .2px; }
  .brand small { display: block; color: var(--muted); font-size: 11.5px; letter-spacing: .4px; margin-top: 2px; }

  .section-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 2px; color: var(--dim); padding: 0 12px; margin-bottom: 4px; }
  .nav { display: flex; flex-direction: column; gap: 3px; }
  .nav button {
    display: flex; align-items: center; gap: 12px; width: 100%; background: transparent; border: 0; color: var(--muted);
    padding: 11px 12px; border-radius: 12px; cursor: pointer; font-size: 14.5px; text-align: left; position: relative;
    transition: background .2s, color .2s, transform .2s;
  }
  .nav button:hover { background: var(--surface-h); color: var(--text); transform: translateX(3px); }
  .nav button.on { background: linear-gradient(90deg, rgba(242,181,68,.16), rgba(255,107,74,.02)); color: var(--text); font-weight: 600; }
  .nav button.on::before {
    content: ""; position: absolute; left: -18px; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--grad);
  }
  .nav .ic { width: 22px; text-align: center; font-size: 15px; }
  .nav .n { margin-left: auto; font-size: 11.5px; background: var(--surface-h); padding: 2px 9px; border-radius: 20px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .mini-stats { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mini-stats div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .mini-stats b { display: block; font-size: 19px; font-variant-numeric: tabular-nums; }
  .mini-stats span { font-size: 11px; color: var(--muted); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 12px 16px;
    font-weight: 600; font-size: 14px; cursor: pointer; background: var(--grad); color: #15100a;
    box-shadow: 0 10px 26px rgba(255,107,74,.25); transition: transform .15s, box-shadow .15s, filter .15s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 14px 34px rgba(255,107,74,.35); filter: brightness(1.05); }
  .btn.ghost { background: var(--surface-h); color: var(--text); box-shadow: none; border: 1px solid var(--line-strong); }
  .btn.ghost:hover { background: rgba(255,255,255,.12); }
  .btn.sm { padding: 8px 12px; font-size: 13px; border-radius: 10px; }

  .tmdb-box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .tmdb-box label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 8px; }
  .tmdb-box .row { display: flex; gap: 6px; }
  .tmdb-box input {
    flex: 1; min-width: 0; background: #0a0a10; border: 1px solid var(--line); padding: 8px 10px; border-radius: 9px; font-size: 12px; outline: none;
  }
  .tmdb-box input:focus { border-color: var(--gold); }
  .tmdb-box button { background: var(--surface-h); border: 1px solid var(--line); border-radius: 9px; padding: 0 11px; cursor: pointer; font-size: 12px; }
  .tmdb-box button:hover { background: rgba(255,255,255,.12); }

  /* ================= Main ================= */
  main { overflow-y: auto; position: relative; }
  .topbar {
    position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; padding: 16px 34px;
    background: rgba(7,7,11,.72); backdrop-filter: blur(16px) saturate(1.3); border-bottom: 1px solid transparent;
    transition: border-color .3s;
  }
  .topbar.scrolled { border-bottom-color: var(--line); }
  .page-title { font-size: 21px; font-weight: 700; margin: 0; white-space: nowrap; }
  .page-title small { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 10px; }
  .spacer { flex: 1; }
  .search { position: relative; width: min(330px, 34vw); }
  .search input {
    width: 100%; background: var(--surface); border: 1px solid var(--line); padding: 10px 14px 10px 38px; border-radius: 40px;
    font-size: 14px; outline: none; transition: border-color .2s, background .2s, width .3s;
  }
  .search input:focus { border-color: var(--gold); background: var(--surface-h); }
  .search::before { content: "⌕"; position: absolute; left: 14px; top: 50%; transform: translateY(-54%); color: var(--muted); font-size: 17px; }
  .search kbd {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--dim);
    border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; font-family: inherit;
  }
  select.sort {
    background: var(--surface); border: 1px solid var(--line); border-radius: 40px; padding: 9px 14px; font-size: 13.5px; cursor: pointer; outline: none;
  }
  select.sort option { background: #14141c; }
  .seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 40px; padding: 3px; }
  .seg button {
    background: transparent; border: 0; padding: 7px 12px; border-radius: 30px; cursor: pointer; color: var(--muted); font-size: 13px;
  }
  .seg button.on { background: var(--surface-h); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong); }

  .content { padding: 4px 34px 70px; animation: rise .5s cubic-bezier(.2,.7,.2,1); }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes shimmer { 0% { background-position: 0 0; } 100% { background-position: 200% 0; } }

  /* ================= Hero (carrossel) ================= */
  .hero { position: relative; height: 470px; border-radius: 26px; overflow: hidden; border: 1px solid var(--line); margin-top: 6px; box-shadow: var(--shadow); }
  .slide {
    position: absolute; inset: 0; opacity: 0; transition: opacity 1s ease; display: flex; align-items: flex-end; pointer-events: none;
  }
  .slide.on { opacity: 1; pointer-events: auto; }
  .slide .bgimg {
    position: absolute; inset: -30px; background-size: cover; background-position: center; transform: scale(1.12);
    transition: transform 9s linear;
  }
  .slide.on .bgimg { transform: scale(1); }
  .slide .shade {
    position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(7,7,11,.97) 8%, rgba(7,7,11,.45) 62%, rgba(7,7,11,.1) 100%),
      linear-gradient(0deg, rgba(7,7,11,1) 0%, transparent 60%);
  }
  .slide .txt { position: relative; padding: 46px 48px; max-width: 640px; transform: translateY(24px); opacity: 0; transition: all .9s cubic-bezier(.2,.7,.2,1) .25s; }
  .slide.on .txt { transform: none; opacity: 1; }
  .kicker { display: inline-flex; align-items: center; gap: 10px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 2.5px; color: var(--gold); font-weight: 600; }
  .kicker::before { content: ""; width: 26px; height: 1px; background: var(--gold); }
  .slide h2 {
    font-family: "Fraunces", Georgia, serif; font-style: italic; font-weight: 500; font-size: 58px; line-height: 1.02; margin: 14px 0 14px; letter-spacing: -.5px;
    text-shadow: 0 6px 30px rgba(0,0,0,.4);
  }
  .meta { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    background: rgba(255,255,255,.07); border: 1px solid var(--line); padding: 4px 11px; border-radius: 20px; font-size: 12px; color: #d4d6e0; backdrop-filter: blur(6px);
  }
  .slide p { color: #b5b9c8; line-height: 1.65; font-size: 15px; margin: 16px 0 26px; max-width: 560px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .slide .hpos {
    position: absolute; right: 56px; bottom: 46px; width: 220px; aspect-ratio: 2/3; border-radius: 18px; overflow: hidden;
    box-shadow: 0 30px 70px rgba(0,0,0,.7); border: 1px solid rgba(255,255,255,.12); transform: perspective(900px) rotateY(-8deg) translateY(30px);
    opacity: 0; transition: all 1.1s cubic-bezier(.2,.7,.2,1) .15s; cursor: pointer;
  }
  .slide.on .hpos { transform: perspective(900px) rotateY(-8deg); opacity: 1; }
  .slide.on .hpos:hover { transform: perspective(900px) rotateY(0) scale(1.03); }

  .hero-arrow {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 4; width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid var(--line-strong); background: rgba(7,7,11,.5); backdrop-filter: blur(8px); cursor: pointer; font-size: 18px;
    display: grid; place-items: center; transition: background .2s;
  }
  .hero-arrow:hover { background: rgba(255,255,255,.14); }
  .hero-arrow.l { left: 16px; } .hero-arrow.r { right: 16px; }
  .dots { position: absolute; left: 48px; bottom: 22px; z-index: 4; display: flex; gap: 8px; }
  .dots button { width: 26px; height: 4px; border-radius: 4px; border: 0; background: rgba(255,255,255,.22); cursor: pointer; padding: 0; transition: all .4s; }
  .dots button.on { width: 46px; background: var(--grad); }

  /* ================= Fileiras ================= */
  .row-block { margin-top: 44px; }
  .row-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
  .row-head h3 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: .2px; }
  .row-head small { color: var(--dim); font-size: 13px; }
  .row-head .see { margin-left: auto; background: none; border: 0; color: var(--gold); font-size: 13.5px; cursor: pointer; padding: 4px 0; }
  .row-head .see:hover { text-decoration: underline; }
  .track { display: flex; gap: 20px; overflow-x: auto; padding: 8px 4px 24px; scroll-snap-type: x proximity; mask-image: linear-gradient(90deg, transparent, #000 2%, #000 96%, transparent); }
  .track > .card { flex: 0 0 178px; scroll-snap-align: start; }

  .stats-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 30px; }
  .stat {
    background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02)); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px 20px; position: relative; overflow: hidden;
  }
  .stat::after { content: ""; position: absolute; right: -30px; top: -30px; width: 90px; height: 90px; border-radius: 50%; background: var(--grad); opacity: .12; }
  .stat b { display: block; font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 13px; }

  /* ================= Cards ================= */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(184px, 1fr)); gap: 24px 22px; }
  .card { cursor: pointer; animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
  .poster {
    position: relative; aspect-ratio: 2/3; border-radius: 15px; overflow: hidden; background: #15151e;
    box-shadow: 0 12px 30px rgba(0,0,0,.5); transition: transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s;
  }
  .card.sq .poster { aspect-ratio: 1/1; }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
  .ph { width: 100%; height: 100%; display: grid; place-items: center; }
  .ph span { font-family: "Fraunces", Georgia, serif; font-style: italic; font-size: 72px; color: rgba(255,255,255,.88); text-shadow: 0 6px 24px rgba(0,0,0,.35); }
  .poster::after {
    content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,.9), transparent 50%); opacity: 0; transition: opacity .35s;
  }
  .play {
    position: absolute; left: 50%; top: 50%; z-index: 3; width: 58px; height: 58px; border-radius: 50%; background: rgba(255,255,255,.96); color: #111;
    display: grid; place-items: center; font-size: 19px; padding-left: 4px; transform: translate(-50%,-50%) scale(.6); opacity: 0; transition: all .35s cubic-bezier(.2,.7,.2,1);
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .card:hover .poster { transform: translateY(-7px); box-shadow: 0 26px 50px rgba(0,0,0,.7); }
  .card:hover .poster img { transform: scale(1.07); }
  .card:hover .poster::after, .card:hover .play { opacity: 1; }
  .card:hover .play { transform: translate(-50%,-50%) scale(1); }
  .tag {
    position: absolute; top: 10px; left: 10px; z-index: 4; font-size: 10.5px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase;
    background: rgba(0,0,0,.55); backdrop-filter: blur(8px); padding: 4px 9px; border-radius: 8px; border: 1px solid rgba(255,255,255,.12);
  }
  .fav-dot { position: absolute; top: 8px; right: 8px; z-index: 4; color: var(--coral); font-size: 16px; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.18); z-index: 4; }
  .bar i { display: block; height: 100%; background: var(--grad); }
  .card .t { font-size: 15px; font-weight: 600; margin: 12px 2px 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .s { font-size: 12.5px; color: var(--muted); margin: 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ================= Lista ================= */
  .list-view { display: flex; flex-direction: column; gap: 8px; }
  .lrow {
    display: flex; align-items: center; gap: 16px; padding: 10px 14px 10px 10px; border-radius: 14px; background: var(--surface);
    border: 1px solid var(--line); cursor: pointer; transition: background .2s, border-color .2s, transform .2s;
  }
  .lrow:hover { background: var(--surface-h); border-color: var(--line-strong); transform: translateX(4px); }
  .lrow .th { width: 52px; height: 52px; border-radius: 10px; overflow: hidden; flex-shrink: 0; position: relative; }
  .lrow .th img, .lrow .th .ph { width: 100%; height: 100%; }
  .lrow .th .ph span { font-size: 22px; }
  .lrow .txt { flex: 1; min-width: 0; }
  .lrow .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow .s { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .lrow .fav-dot { position: static; }

  .empty-big { text-align: center; padding: 100px 24px; color: var(--muted); }
  .empty-big .big { font-family: "Fraunces", Georgia, serif; font-style: italic; font-size: 84px; line-height: 1; margin-bottom: 12px;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .empty-big h2 { color: var(--text); font-size: 28px; margin: 0 0 10px; font-weight: 600; }
  .empty-big p { max-width: 480px; margin: 0 auto 26px; line-height: 1.7; }
  .empty-big .btn { font-size: 15px; padding: 14px 28px; }

  /* ================= Modal ================= */
  .modal {
    position: fixed; inset: 0; z-index: 100; display: none; background: rgba(3,3,6,.72); backdrop-filter: blur(10px) saturate(1.1);
    align-items: center; justify-content: center; padding: 28px;
  }
  .modal.open { display: flex; animation: fadeIn .3s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .sheet {
    position: relative; width: min(1040px, 100%); max-height: 92vh; overflow-y: auto; border-radius: 26px; background: var(--bg2);
    border: 1px solid var(--line-strong); box-shadow: 0 50px 120px rgba(0,0,0,.8); animation: pop .45s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes pop { from { transform: translateY(24px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet .backdrop { position: relative; height: 300px; background-size: cover; background-position: center; }
  .sheet .backdrop::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, var(--bg2) 0%, rgba(15,15,22,.35) 70%); }
  .sheet .body { position: relative; margin-top: -150px; padding: 0 40px 40px; display: grid; grid-template-columns: 210px 1fr; gap: 34px; }
  .sheet .mposter .poster { box-shadow: 0 30px 60px rgba(0,0,0,.7); }
  .sheet .mposter.sq .poster { aspect-ratio: 1/1; }
  .sheet .mtext { padding-top: 150px; min-width: 0; }
  .sheet h2 { font-family: "Fraunces", Georgia, serif; font-style: italic; font-weight: 500; font-size: 40px; margin: 0 0 12px; line-height: 1.05; }
  .overview { color: #b5b9c8; line-height: 1.7; font-size: 15px; margin: 14px 0 0; max-width: 680px; }
  .toolrow { display: flex; gap: 10px; align-items: center; margin-top: 18px; flex-wrap: wrap; }
  .credit { font-size: 11.5px; color: var(--dim); margin-top: 16px; }
  .close {
    position: absolute; top: 18px; right: 18px; z-index: 6; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line-strong);
    background: rgba(0,0,0,.45); backdrop-filter: blur(8px); font-size: 20px; cursor: pointer; display: grid; place-items: center; transition: background .2s;
  }
  .close:hover { background: rgba(255,255,255,.16); }

  .player { margin-top: 22px; }
  .player video, .player audio { width: 100%; border-radius: 16px; background: #000; display: block; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
  .player audio { margin-top: 4px; }
  .now { display: grid; grid-template-columns: 120px 1fr; gap: 18px; align-items: center; padding: 18px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
  .now .poster { aspect-ratio: 1/1; border-radius: 14px; }
  .now .poster img, .now .ph { width: 100%; height: 100%; }
  .now .nt { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .now .ns { color: var(--muted); font-size: 13px; margin-bottom: 12px; }

  .list-title { margin: 26px 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: var(--dim); }
  .ep-list { display: flex; flex-direction: column; gap: 6px; }
  .ep {
    display: flex; align-items: center; gap: 14px; padding: 11px 14px; border-radius: 13px; background: var(--surface);
    border: 1px solid transparent; cursor: pointer; transition: background .2s, border-color .2s; position: relative; overflow: hidden;
  }
  .ep:hover { background: var(--surface-h); }
  .ep.playing { border-color: rgba(242,181,68,.5); background: linear-gradient(90deg, rgba(242,181,68,.12), transparent); }
  .ep .num {
    width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--surface-h);
    font-size: 13px; font-weight: 600; flex-shrink: 0; font-variant-numeric: tabular-nums;
  }
  .ep.playing .num { background: var(--grad); color: #15100a; }
  .ep .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ep .mark { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .ep .done { color: #7ddc9c; font-size: 13px; }
  .ep .bar { background: rgba(255,255,255,.06); }
  .ep-season { margin: 18px 0 8px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 2px; color: var(--gold); }
  .tmdb-note { margin-top: 14px; font-size: 12px; color: var(--dim); }

  .toast {
    position: fixed; bottom: 26px; left: 50%; transform: translate(-50%, 20px); background: rgba(24,24,34,.95); border: 1px solid var(--line-strong);
    padding: 12px 20px; border-radius: 14px; font-size: 14px; opacity: 0; pointer-events: none; transition: all .35s; z-index: 200; box-shadow: var(--shadow);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .hint { color: var(--dim); font-size: 12px; margin-top: 10px; }

  @media (max-width: 980px) {
    .app { grid-template-columns: 1fr; }
    aside { display: none; }
    .slide h2 { font-size: 40px; }
    .slide .hpos { display: none; }
    .sheet .body { grid-template-columns: 1fr; }
    .sheet .mposter { width: 170px; }
    .sheet .mtext { padding-top: 20px; }
    .stats-strip { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="app">

  <aside>
    <div class="brand">
      <div class="logo">▶</div>
      <div><h1>Biblioteca</h1><small>filmes · séries · músicas</small></div>
    </div>

    <div>
      <div class="section-label">Explorar</div>
      <nav class="nav" id="nav">
        <button data-view="home" class="on"><span class="ic">✦</span>Início</button>
        <button data-view="movie"><span class="ic">🎬</span>Filmes <span class="n" data-count="movie">0</span></button>
        <button data-view="series"><span class="ic">📺</span>Séries <span class="n" data-count="series">0</span></button>
        <button data-view="music"><span class="ic">🎵</span>Músicas <span class="n" data-count="music">0</span></button>
        <button data-view="fav"><span class="ic">♥</span>Favoritos <span class="n" data-count="fav">0</span></button>
      </nav>
    </div>

    <div class="mini-stats" id="miniStats"></div>

    <div>
      <button class="btn" id="pick" style="width:100%">📁 Escolher pasta</button>
      <input type="file" id="folder" webkitdirectory directory multiple hidden>
      <p class="hint">Nada é enviado para a internet. Tudo fica no seu PC.</p>
    </div>

    <div class="tmdb-box">
      <label>Chave TMDB (opcional, para capas e sinopses em português)</label>
      <div class="row">
        <input type="text" id="tmdbKey" placeholder="Cole sua chave v3">
        <button id="saveKey">OK</button>
      </div>
    </div>
  </aside>

  <main id="main">
    <header class="topbar" id="topbar">
      <h2 class="page-title" id="title">Início</h2>
      <div class="spacer"></div>
      <div class="search"><input type="search" id="search" placeholder="Buscar..."><kbd>/</kbd></div>
      <select class="sort" id="sort">
        <option value="name">A–Z</option>
        <option value="year">Ano</option>
        <option value="recent">Mais recentes</option>
      </select>
      <div class="seg" id="layout">
        <button data-layout="grid" class="on" title="Grade">▦</button>
        <button data-layout="list" title="Lista">☰</button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ Constantes e estado ============ */
const VIDEO_EXT = ["mp4","mkv","avi","mov","wmv","m4v","webm"];
const AUDIO_EXT = ["mp3","flac","m4a","wav","ogg","aac","opus","wma"];
const IMAGE_EXT = ["jpg","jpeg","png","webp"];
const COVER_NAMES = ["cover","folder","poster","capa","front","album","artwork"];
const TITLES = { home: "Início", movie: "Filmes", series: "Séries", music: "Músicas", fav: "Favoritos" };
const TYPE_LABEL = { movie: "Filme", series: "Série", music: "Álbum" };

const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

const state = {
  library: [],
  view: "home",
  query: "",
  sort: "name",
  layout: "grid",
  tmdbKey: "",
  favs: new Set(load("bib-favs", [])),
  progress: load("bib-progress", {}),   // { caminhoDoArquivo: {owner, idx, t, d, u} }
  heroIdx: 0,
};
const tmdbCache = {};
let heroTimer = null;

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const ext = n => (n.split(".").pop() || "").toLowerCase();
const baseName = n => n.replace(/\.[^.]+$/, "");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTime = s => { if (!isFinite(s) || s < 0) return "0:00"; const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = Math.floor(s % 60); const p = n => String(n).padStart(2, "0"); return h ? `${h}:${p(m)}:${p(sec)}` : `${m}:${p(sec)}`; };

function cleanTitle(s) {
  return s.replace(/[._]+/g, " ")
          .replace(/\[[^\]]*\]|\([^)]*(1080p|720p|2160p|4k|x264|x265|hdr|web|bluray|dvd)[^)]*\)/gi, "")
          .replace(/\s+/g, " ").trim();
}
function extractYear(s) { const m = s.match(/[\(\. ](19\d{2}|20\d{2})[\)\. ]/); return m ? m[1] : ""; }
function hueOf(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function fallbackBg(t) {
  const h = hueOf(t);
  return `background: radial-gradient(120% 90% at 20% 10%, hsl(${h} 70% 46%), transparent 60%), linear-gradient(160deg, hsl(${(h + 40) % 360} 55% 22%), hsl(${(h + 90) % 360} 45% 8%))`;
}

/* ============ Leitura das pastas ============ */
$("#pick").onclick = () => $("#folder").click();
$("#folder").addEventListener("change", e => buildLibrary(Array.from(e.target.files)));

function buildLibrary(files) {
  const folders = {};
  for (const f of files) {
    const path = f.webkitRelativePath.split("/").slice(0, -1).join("/");
    const e = ext(f.name);
    const g = (folders[path] ??= { images: [], videos: [], audios: [] });
    if (IMAGE_EXT.includes(e)) g.images.push(f);
    else if (VIDEO_EXT.includes(e)) g.videos.push(f);
    else if (AUDIO_EXT.includes(e)) g.audios.push(f);
  }

  const lib = [], seriesMap = {}, albums = {};

  for (const [path, g] of Object.entries(folders)) {
    const folderName = path.split("/").pop() || "";
    const folderCover = findCover(g.images, folderName);

    for (const v of g.videos) {
      const name = baseName(v.name), rel = v.webkitRelativePath, url = URL.createObjectURL(v);
      const ep = name.match(/^(.*?)[\s._-]*S(\d{1,2})E(\d{1,2})/i);
      if (ep || /^(Season|Temporada)/i.test(folderName)) {
        let st = ep ? cleanTitle(ep[1]) : cleanTitle(path.split("/").slice(-2, -1)[0] || "");
        if (!st) st = cleanTitle(folderName) || "Série sem nome";
        const key = "tv|" + st.toLowerCase();
        const s = (seriesMap[key] ??= { type: "series", key, title: st, year: "", cover: null, overview: "", items: [], mtime: 0 });
        s.items.push({ rel, url, name: cleanTitle(ep ? name.replace(ep[0], "") : name) || "Episódio", season: ep ? +ep[2] : 1, ep: ep ? +ep[3] : 0 });
        s.cover ??= folderCover || findCoverUp(folders, st);
        s.year ||= extractYear(name);
        s.mtime = Math.max(s.mtime, v.lastModified);
      } else {
        const title = cleanTitle(name.replace(/\(?(19|20)\d{2}\)?.*/, "")) || cleanTitle(name);
        lib.push({
          type: "movie", key: "m|" + rel, title, year: extractYear(name),
          cover: findCover(g.images, name) || folderCover, overview: "",
          items: [{ rel, url, name: title }], mtime: v.lastModified,
        });
      }
    }

    if (g.audios.length) {
      const parts = path.split("/");
      const artist = parts.length > 1 ? cleanTitle(parts[parts.length - 2]) : "Artista desconhecido";
      const sorted = [...g.audios].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
      albums["a|" + path] = {
        type: "music", key: "a|" + path, title: cleanTitle(folderName) || "Sem álbum", sub: artist,
        cover: folderCover, overview: "", mtime: Math.max(...sorted.map(f => f.lastModified)),
        items: sorted.map(au => ({ rel: au.webkitRelativePath, url: URL.createObjectURL(au), name: cleanTitle(baseName(au.name)) })),
      };
    }
  }

  state.library = [...lib, ...Object.values(seriesMap), ...Object.values(albums)];
  state.library.forEach((x, i) => {
    x.id = i;
    x.backdrop = x.cover;
    if (x.type === "series") x.items.sort((a, b) => a.season - b.season || a.ep - b.ep);
  });
  state.heroIdx = 0;
  toast(`${state.library.length} itens carregados`);
  render();
}

function findCover(images, hint) {
  if (!images.length) return null;
  const byName = images.find(i => COVER_NAMES.includes(baseName(i.name).toLowerCase()));
  if (byName) return URL.createObjectURL(byName);
  if (hint) {
    const same = images.find(i => baseName(i.name).toLowerCase() === hint.toLowerCase());
    if (same) return URL.createObjectURL(same);
  }
  return URL.createObjectURL(images[0]);
}
function findCoverUp(folders, title) {
  for (const [p, g] of Object.entries(folders)) {
    if (g.images.length && p.toLowerCase().includes(title.toLowerCase())) return findCover(g.images, "");
  }
  return null;
}

/* ============ Listas e ordenação ============ */
function sortList(list) {
  const s = state.sort;
  return [...list].sort((a, b) => {
    if (s === "year") return Number(b.year || 0) - Number(a.year || 0) || a.title.localeCompare(b.title, "pt-BR");
    if (s === "recent") return b.mtime - a.mtime;
    return a.title.localeCompare(b.title, "pt-BR", { sensitivity: "base", numeric: true });
  });
}
function scopeList() {
  const v = state.view;
  let list = state.library;
  if (v === "movie" || v === "series" || v === "music") list = list.filter(x => x.type === v);
  if (v === "fav") list = list.filter(x => state.favs.has(x.key));
  if (state.query) list = list.filter(x => (x.title + " " + (x.sub || "") + " " + (x.year || "")).toLowerCase().includes(state.query));
  return sortList(list);
}
function continueList() {
  const entries = Object.entries(state.progress)
    .filter(([, p]) => p.t > 5 && (!p.d || p.t < p.d - 30))
    .sort((a, b) => b[1].u - a[1].u);
  const seen = new Set(), out = [];
  for (const [, p] of entries) {
    if (seen.has(p.owner)) continue;
    const owner = state.library.find(x => x.key === p.owner);
    if (!owner) continue;
    seen.add(p.owner);
    out.push({ owner, idx: p.idx, t: p.t, d: p.d });
    if (out.length >= 12) break;
  }
  return out;
}

/* ============ Renderização ============ */
function render() {
  clearInterval(heroTimer);
  const counts = { movie: 0, series: 0, music: 0 };
  state.library.forEach(x => counts[x.type]++);
  const favCount = state.library.filter(x => state.favs.has(x.key)).length;
  $$("[data-count]").forEach(el => el.textContent = el.dataset.count === "fav" ? favCount : counts[el.dataset.count]);
  $("#miniStats").innerHTML = `
    <div><b>${counts.movie}</b><span>filmes</span></div>
    <div><b>${counts.series}</b><span>séries</span></div>
    <div><b>${counts.music}</b><span>álbuns</span></div>
    <div><b>${state.library.reduce((n, x) => n + x.items.length, 0)}</b><span>arquivos</span></div>`;

  const hasQuery = state.query.length > 0;
  $("#title").innerHTML = hasQuery
    ? `Resultados<small>para "${esc(state.query)}"</small>`
    : `${TITLES[state.view]}<small>${state.view === "home" ? "sua coleção" : ""}</small>`;
  $("#layout").style.display = state.view === "home" && !hasQuery ? "none" : "flex";

  const content = $("#content");
  if (!state.library.length) { content.innerHTML = emptyState(); return; }
  if (state.view === "home" && !hasQuery) { content.innerHTML = homeHTML(counts, favCount); bindHero(); return; }

  const list = scopeList();
  if (!list.length) {
    content.innerHTML = `<div class="empty-big"><div class="big">?</div><h2>Nada por aqui</h2><p>${state.view === "fav" ? "Clique no coração de um título para adicioná-lo aos favoritos." : "Tente outro termo ou troque de categoria."}</p></div>`;
    return;
  }
  content.innerHTML = state.layout === "list"
    ? `<div class="list-view">${list.map(rowHTML).join("")}</div>`
    : `<div class="grid">${list.map(x => cardHTML(x)).join("")}</div>`;
}

function emptyState() {
  return `<div class="empty-big">
    <div class="big">Acervo</div>
    <h2>Sua biblioteca começa aqui</h2>
    <p>Escolha a pasta onde estão seus filmes, séries e músicas. A ferramenta organiza tudo, mostra as capas e reproduz no próprio navegador, sem enviar nada para a internet.</p>
    <button class="btn" onclick="$('#folder').click()">📁 Escolher pasta</button>
  </div>`;
}

function homeHTML(counts, favCount) {
  const pool = state.library.filter(x => x.cover);
  const slides = (pool.length ? pool : state.library).slice(0, 6);
  const cont = continueList();
  const favs = state.library.filter(x => state.favs.has(x.key));
  const recent = [...state.library].sort((a, b) => b.mtime - a.mtime).slice(0, 14);
  const movies = sortList(state.library.filter(x => x.type === "movie"));
  const series = sortList(state.library.filter(x => x.type === "series"));
  const albums = sortList(state.library.filter(x => x.type === "music"));

  const slideHTML = slides.map((x, i) => {
    const bg = x.backdrop ? `background-image:url('${x.backdrop}')` : fallbackBg(x.title);
    const info = x.type === "music" ? `${esc(x.sub || "")} · ${x.items.length} faixas`
      : x.type === "series" ? `${x.items.length} episódios` : (x.year || "Filme");
    return `<div class="slide ${i === 0 ? "on" : ""}">
      <div class="bgimg" style="${bg}"></div>
      <div class="shade"></div>
      <div class="txt">
        <div class="kicker">${TYPE_LABEL[x.type]} em destaque</div>
        <h2>${esc(x.title)}</h2>
        <div class="meta">
          ${x.year ? `<span class="chip">${esc(x.year)}</span>` : ""}
          <span class="chip">${info}</span>
          ${state.favs.has(x.key) ? `<span class="chip">♥ Favorito</span>` : ""}
        </div>
        <p>${esc(x.overview || "Escolha uma capa e comece a assistir ou ouvir agora.")}</p>
        <div class="actions">
          <button class="btn" data-open="${x.id}">▶ ${x.type === "music" ? "Ouvir" : "Assistir"}</button>
          <button class="btn ghost" data-fav="${x.id}">${state.favs.has(x.key) ? "♥ Nos favoritos" : "♡ Favoritar"}</button>
        </div>
      </div>
      <div class="hpos" data-open="${x.id}">${posterInner(x)}</div>
    </div>`;
  }).join("");

  const dots = slides.map((_, i) => `<button data-dot="${i}" class="${i === 0 ? "on" : ""}" aria-label="Destaque ${i + 1}"></button>`).join("");

  const contRow = cont.length ? rowBlock("Continuar assistindo", cont.length, `
    <div class="track">${cont.map(c => cardHTML(c.owner, { idx: c.idx, t: c.t, d: c.d })).join("")}</div>`) : "";
  const favRow = favs.length ? rowBlock("Seus favoritos", favs.length, `<div class="track">${favs.map(x => cardHTML(x)).join("")}</div>`, "fav") : "";
  const recentRow = rowBlock("Adicionados recentemente", recent.length, `<div class="track">${recent.map(x => cardHTML(x)).join("")}</div>`);

  return `
    <div class="hero" id="hero">
      ${slideHTML}
      ${slides.length > 1 ? `<button class="hero-arrow l" data-hero="-1">‹</button><button class="hero-arrow r" data-hero="1">›</button><div class="dots">${dots}</div>` : ""}
    </div>

    <div class="stats-strip">
      <div class="stat"><b>${counts.movie}</b><span>Filmes na coleção</span></div>
      <div class="stat"><b>${counts.series}</b><span>Séries</span></div>
      <div class="stat"><b>${counts.music}</b><span>Álbuns</span></div>
      <div class="stat"><b>${favCount}</b><span>Favoritos</span></div>
    </div>

    ${contRow}
    ${favRow}
    ${recentRow}
    ${movies.length ? rowBlock("Filmes", movies.length, `<div class="track">${movies.map(x => cardHTML(x)).join("")}</div>`, "movie") : ""}
    ${series.length ? rowBlock("Séries", series.length, `<div class="track">${series.map(x => cardHTML(x)).join("")}</div>`, "series") : ""}
    ${albums.length ? rowBlock("Álbuns", albums.length, `<div class="track">${albums.map(x => cardHTML(x)).join("")}</div>`, "music") : ""}
  `;
}

function rowBlock(title, count, inner, goto) {
  return `<section class="row-block">
    <div class="row-head"><h3>${title}</h3><small>${count}</small>${goto ? `<button class="see" data-goto="${goto}">Ver todos →</button>` : ""}</div>
    ${inner}
  </section>`;
}

function posterInner(x) {
  return x.cover
    ? `<img src="${x.cover}" alt="" loading="lazy">`
    : `<div class="ph" style="${fallbackBg(x.title)}"><span>${esc((x.title[0] || "?").toUpperCase())}</span></div>`;
}

function cardHTML(x, resume) {
  const sq = x.type === "music" ? "sq" : "";
  const tag = x.type === "music" ? `${x.items.length} faixas` : TYPE_LABEL[x.type];
  let sub = x.type === "music" ? x.sub : x.type === "series" ? `${x.items.length} episódios` : (x.year || "Filme");
  let attrs = `data-open="${x.id}"`;
  let bar = "";
  if (resume) {
    const pct = resume.d ? Math.min(100, resume.t / resume.d * 100) : 0;
    const epLabel = x.type === "series" ? `T${x.items[resume.idx].season} E${x.items[resume.idx].ep} · ` : "";
    sub = `${epLabel}${fmtTime(resume.t)} de ${fmtTime(resume.d)}`;
    attrs += ` data-idx="${resume.idx}" data-t="${resume.t}"`;
    bar = `<div class="bar"><i style="width:${pct}%"></i></div>`;
  }
  return `<div class="card ${sq}" ${attrs}>
    <div class="poster">
      ${posterInner(x)}
      <span class="tag">${tag}</span>
      ${state.favs.has(x.key) ? `<span class="fav-dot">♥</span>` : ""}
      ${bar}
      <div class="play">▶</div>
    </div>
    <div class="t">${esc(x.title)}</div>
    <div class="s">${esc(sub)}</div>
  </div>`;
}

function rowHTML(x) {
  const sub = [x.type === "music" ? x.sub : null, x.year || null, `${x.items.length} ${x.type === "music" ? "faixas" : x.type === "series" ? "episódios" : "arquivo"}`]
    .filter(Boolean).join(" · ");
  return `<div class="lrow" data-open="${x.id}">
    <div class="th">${posterInner(x)}</div>
    <div class="txt"><div class="t">${esc(x.title)}</div><div class="s">${esc(sub)}</div></div>
    ${state.favs.has(x.key) ? `<span class="fav-dot">♥</span>` : ""}
    <span class="tag" style="position:static">${TYPE_LABEL[x.type]}</span>
  </div>`;
}

/* ============ Carrossel ============ */
function bindHero() {
  const slides = $$(".slide");
  if (slides.length < 2) return;
  heroTimer = setInterval(() => goHero(state.heroIdx + 1), 8000);
}
function goHero(n) {
  const slides = $$(".slide");
  if (!slides.length) return;
  state.heroIdx = (n + slides.length) % slides.length;
  slides.forEach((s, i) => s.classList.toggle("on", i === state.heroIdx));
  $$("[data-dot]").forEach((d, i) => d.classList.toggle("on", i === state.heroIdx));
  clearInterval(heroTimer);
  heroTimer = setInterval(() => goHero(state.heroIdx + 1), 8000);
}

/* ============ Detalhes ============ */
function openItem(id, startIdx = 0, startT = 0) {
  const x = state.library.find(i => i.id === id);
  if (!x) return;
  const isMusic = x.type === "music";
  const bg = x.backdrop ? `background-image:url('${x.backdrop}')` : fallbackBg(x.title);
  const chips = [
    x.year && `<span class="chip">${esc(x.year)}</span>`,
    `<span class="chip">${TYPE_LABEL[x.type]}</span>`,
    isMusic && x.sub && `<span class="chip">${esc(x.sub)}</span>`,
    `<span class="chip">${x.items.length} ${isMusic ? "faixas" : x.type === "series" ? "episódios" : "arquivo"}</span>`,
  ].filter(Boolean).join("");

  let list = "";
  if (x.type === "series") {
    let html = "", last = null;
    x.items.forEach((it, i) => {
      if (it.season !== last) { html += `<div class="ep-season">Temporada ${it.season}</div>`; last = it.season; }
      html += epRow(it, i, `${it.ep || i + 1}`);
    });
    list = `<div class="list-title">Episódios</div><div class="ep-list">${html}</div>`;
  } else if (isMusic) {
    list = `<div class="list-title">Faixas</div><div class="ep-list">${x.items.map((it, i) => epRow(it, i, String(i + 1).padStart(2, "0"))).join("")}</div>`;
  }

  $("#sheet").innerHTML = `
    <button class="close" id="closeBtn" aria-label="Fechar">×</button>
    <div class="backdrop" style="${bg}"></div>
    <div class="body">
      <div class="mposter ${isMusic ? "sq" : ""}"><div class="poster">${posterInner(x)}</div></div>
      <div class="mtext">
        <div class="kicker">${TYPE_LABEL[x.type]}</div>
        <h2 style="margin-top:10px">${esc(x.title)}</h2>
        <div class="meta">${chips}</div>
        <div class="toolrow">
          <button class="btn sm ghost" data-fav="${x.id}" id="favBtn">${state.favs.has(x.key) ? "♥ Nos favoritos" : "♡ Favoritar"}</button>
        </div>
        <p class="overview" id="overview">${esc(x.overview || "")}</p>
        <div class="player" id="player"></div>
        ${list}
        <div class="tmdb-note" id="tmdbNote"></div>
      </div>
    </div>`;

  $("#closeBtn").onclick = closeModal;
  $$("#sheet .ep").forEach(el => el.onclick = () => playIn(x, +el.dataset.ep));
  $("#modal").classList.add("open");
  playIn(x, startIdx, startT);
  if (!isMusic) loadTmdb(x);
}

function epRow(it, i, label) {
  const pr = state.progress[it.rel];
  const pct = pr && pr.d ? Math.min(100, pr.t / pr.d * 100) : 0;
  return `<div class="ep" data-ep="${i}">
    <div class="num">${esc(label)}</div>
    <div class="name">${esc(it.name)}</div>
    ${pct > 0 && pct < 95 ? `<span class="mark">${fmtTime(pr.t)}</span>` : ""}
    <span class="play-ic" style="color:var(--dim)">▶</span>
    ${pct > 0 ? `<div class="bar" style="width:100%"><i style="width:${pct}%"></i></div>` : ""}
  </div>`;
}

function playIn(x, i, startT = 0) {
  const item = x.items[i];
  if (!item) return;
  const player = $("#player");
  const isAudio = x.type === "music";

  if (isAudio) {
    player.innerHTML = `
      <div class="now">
        <div class="poster">${posterInner(x)}</div>
        <div>
          <div class="nt">${esc(item.name)}</div>
          <div class="ns">${esc(x.title)} · ${esc(x.sub || "")}</div>
          <audio id="media" controls autoplay src="${item.url}"></audio>
        </div>
      </div>`;
  } else {
    player.innerHTML = `<video id="media" controls autoplay playsinline src="${item.url}"></video>`;
  }

  const media = $("#media");
  media.addEventListener("loadedmetadata", () => {
    if (startT > 0 && startT < media.duration - 10) media.currentTime = startT;
  });
  let lastSave = 0;
  media.addEventListener("timeupdate", () => {
    if (Date.now() - lastSave < 4000) return;
    lastSave = Date.now();
    saveProgress(x, i, item, media);
  });
  media.addEventListener("pause", () => saveProgress(x, i, item, media));
  media.addEventListener("ended", () => {
    delete state.progress[item.rel];
    store("bib-progress", state.progress);
    if (x.type === "series" && i + 1 < x.items.length) playIn(x, i + 1);
    else if (x.type === "music" && i + 1 < x.items.length) playIn(x, i + 1);
    else render();
  });

  $$("#sheet .ep").forEach(el => el.classList.toggle("playing", +el.dataset.ep === i));
}

function saveProgress(x, i, item, media) {
  if (!isFinite(media.duration) || media.currentTime < 5) return;
  state.progress[item.rel] = { owner: x.key, idx: i, t: media.currentTime, d: media.duration, u: Date.now() };
  store("bib-progress", state.progress);
}

function closeModal() {
  $("#modal").classList.remove("open");
  $("#sheet").innerHTML = "";     // interrompe a reprodução
  render();
}

/* ============ Favoritos ============ */
function toggleFav(id) {
  const x = state.library.find(i => i.id === id);
  if (!x) return;
  if (state.favs.has(x.key)) { state.favs.delete(x.key); toast("Removido dos favoritos"); }
  else { state.favs.add(x.key); toast("Adicionado aos favoritos ♥"); }
  store("bib-favs", [...state.favs]);
  const b = $("#favBtn");
  if (b) b.textContent = state.favs.has(x.key) ? "♥ Nos favoritos" : "♡ Favoritar";
  render();
}

/* ============ TMDB (opcional) ============ */
async function loadTmdb(x) {
  const note = () => $("#tmdbNote");
  if (!state.tmdbKey) { if (note()) note().textContent = "Dica: cole sua chave TMDB na barra lateral para buscar capas e sinopses em português."; return; }
  const cacheKey = x.type + ":" + x.title;
  try {
    let data = tmdbCache[cacheKey];
    if (!data) {
      const type = x.type === "movie" ? "movie" : "tv";
      const url = `https://api.themoviedb.org/3/search/${type}?api_key=${encodeURIComponent(state.tmdbKey)}&language=pt-BR&query=${encodeURIComponent(x.title)}`;
      const r = await fetch(url);
      const j = await r.json();
      data = (j.results && j.results[0]) || {};
      tmdbCache[cacheKey] = data;
    }
    if (!data.id) { if (note()) note().textContent = "TMDB: nenhum resultado para este título."; return; }
    x.overview = data.overview || x.overview;
    if (data.poster_path) x.cover = `https://image.tmdb.org/t/p/w500${data.poster_path}`;
    if (data.backdrop_path) x.backdrop = `https://image.tmdb.org/t/p/w1280${data.backdrop_path}`;
    if ($("#overview")) $("#overview").textContent = x.overview;
    const sb = $("#sheet .backdrop");
    if (sb && x.backdrop) sb.style.backgroundImage = `url('${x.backdrop}')`;
    const pimg = $("#sheet .mposter .poster");
    if (pimg && x.cover) pimg.innerHTML = `<img src="${x.cover}" alt="">`;
    if (note()) note().textContent = "Informações e capas: TMDB";
  } catch {
    if (note()) note().textContent = "Não foi possível consultar o TMDB agora.";
  }
}

/* ============ Eventos ============ */
$("#saveKey").onclick = () => {
  state.tmdbKey = $("#tmdbKey").value.trim();
  toast(state.tmdbKey ? "Chave salva nesta sessão" : "Chave removida");
};

function setView(v) {
  state.view = v;
  $$("#nav button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
}
$("#nav").addEventListener("click", e => {
  const b = e.target.closest("button[data-view]");
  if (!b) return;
  state.query = ""; $("#search").value = "";
  setView(b.dataset.view);
  render();
  $("#main").scrollTop = 0;
});

let searchT;
$("#search").addEventListener("input", e => {
  clearTimeout(searchT);
  searchT = setTimeout(() => { state.query = e.target.value.trim().toLowerCase(); render(); }, 120);
});
$("#sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
$("#layout").addEventListener("click", e => {
  const b = e.target.closest("button[data-layout]");
  if (!b) return;
  state.layout = b.dataset.layout;
  $$("#layout button").forEach(x => x.classList.toggle("on", x === b));
  render();
});

document.addEventListener("click", e => {
  const hero = e.target.closest("[data-hero]");
  if (hero) return goHero(state.heroIdx + +hero.dataset.hero);
  const dot = e.target.closest("[data-dot]");
  if (dot) return goHero(+dot.dataset.dot);
  const fav = e.target.closest("[data-fav]");
  if (fav) return toggleFav(+fav.dataset.fav);
  const open = e.target.closest("[data-open]");
  if (open) return openItem(+open.dataset.open, +(open.dataset.idx || 0), +(open.dataset.t || 0));
  const goto = e.target.closest("[data-goto]");
  if (goto) { setView(goto.dataset.goto); render(); $("#main").scrollTop = 0; }
});

$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
document.addEventListener("keydown", e => {
  const typing = e.target.matches("input, textarea, select");
  if (e.key === "Escape") { if ($("#modal").classList.contains("open")) closeModal(); return; }
  if (e.key === "/" && !typing) { e.preventDefault(); $("#search").focus(); return; }
  if (e.key === " " && !typing && $("#modal").classList.contains("open")) {
    const m = $("#media");
    if (m) { e.preventDefault(); m.paused ? m.play() : m.pause(); }
  }
  if (!typing && !$("#modal").classList.contains("open") && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
    goHero(state.heroIdx + (e.key === "ArrowRight" ? 1 : -1));
  }
});

$("#main").addEventListener("scroll", e => $("#topbar").classList.toggle("scrolled", e.target.scrollTop > 10));

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2400);
}

render();
</script>
</body>
</html>
